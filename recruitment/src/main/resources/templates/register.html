<!-- Registration form. Use reusable fragments (HGP 27) and client-side validation (HGP 26) where appropriate. -->
<!--Hardcoded in english atm-->

<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout('Register Account', ~{::body})">
<body>
  <body>
    <h1>Register your account</h1>
    <form method="post" th:action="@{/register}" th:object="${registerForm}">
      <div
        th:replace="fragments :: field('First name', 'firstName', 'text')"></div>
      <div
        th:replace="fragments :: field('Last name', 'lastName', 'text')"></div>
      <div 
        th:replace="fragments :: field('Username', 'username', 'text')"></div>
      <div 
        th:replace="fragments :: fieldWithRules('Person number','personNumber','text', 12, 13, '\\d{8}-?\\d{4}', 'Use YYYYMMDD-XXXX')"></div>
      <div
        th:replace="fragments :: field('Email address', 'email', 'email')"></div>
      <div
        th:replace="fragments :: fieldWithRules('Password','password','password',6, 100,'.*','At least 6 characters')"></div>
      <div
        th:replace="fragments :: fieldWithRules('Confirm password','confirmedPassword','password',6, 100,'.*','At least 6 characters')"></div>
      <div>
        <button type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
